<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="粉体选型">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#000" media="(prefers-color-scheme:dark)">
<title>粉体设备高级预选型</title>
<style>
  :root{
    --bg:#f2f2f7; --card:#fff; --text:#000; --sub:#8a8a8e;
    --line:rgba(60,60,67,.12); --accent:#007aff; --danger:#ff3b30;
    --fill:rgba(120,120,128,.12); --warn-bg:rgba(255,149,0,.15); --warn-text:#ff9500;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#000; --card:#1c1c1e; --text:#fff; --sub:#8e8e93;
      --line:rgba(255,255,255,.13); --accent:#0a84ff; --danger:#ff453a;
      --fill:rgba(120,120,128,.24); --warn-bg:rgba(255,159,10,.2); --warn-text:#ff9f0a;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:calc(env(safe-area-inset-top) + 22px) 16px calc(env(safe-area-inset-bottom) + 40px);
  }
  .wrap{max-width:520px;margin:0 auto;}

  .hd{padding:0 4px 18px;}
  .hd h1{margin:0;font-size:27px;font-weight:700;letter-spacing:-.02em;}
  .hd p{margin:6px 0 0;font-size:13px;font-weight:500;color:var(--sub);}

  .card{
    background:var(--card); border-radius:18px; overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 30px rgba(0,0,0,.05);
    margin-bottom:14px;
  }
  @media (prefers-color-scheme:dark){ .card{box-shadow:none;} }

  .row{padding:13px 18px;}
  .row + .row{border-top:1px solid var(--line);}
  .lbl{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:3px;}
  .lbl em{font-style:normal;font-size:11px;font-weight:400;}
  .row input, .row select{
    display:block;width:100%;padding:4px 0;border:0;outline:0;background:transparent;
    color:var(--text);font-family:inherit;font-size:17px;font-weight:600;
    -webkit-appearance:none;appearance:none;
  }
  .row input::placeholder{color:var(--sub);opacity:.4;font-weight:500;}
  .row select{cursor:pointer;}
  .row select option{background:var(--card);color:var(--text);}

  .seg{display:flex;gap:4px;padding:0 18px 16px;}
  .seg button{
    flex:1;padding:9px 0;border:0;border-radius:9px;background:var(--fill);
    color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
    transition:background .15s,color .15s;
  }
  .seg button.on{background:var(--accent);color:#fff;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 18px 18px;}
  .chip{
    padding:8px 12px;border-radius:10px;border:0;background:var(--fill);
    color:var(--text);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;
    transition:background .15s,color .15s;
  }
  .chip.on{background:var(--accent);color:#fff;}

  .go{
    display:block;width:100%;padding:17px;border:0;border-radius:16px;
    background:var(--accent);color:#fff;font-family:inherit;
    font-size:17px;font-weight:700;letter-spacing:.01em;cursor:pointer;
    margin:4px 0 22px;
  }
  .go:active{opacity:.82;}

  .res-head{
    display:flex;align-items:center;gap:8px;padding:0 4px 10px;
    font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.02em;
  }
  .main{padding:20px 18px 18px;}
  .badge{
    display:inline-block;padding:4px 9px;border-radius:7px;
    background:color-mix(in srgb, var(--accent) 15%, transparent);
    color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.04em;
    margin-bottom:10px;
  }
  .main h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;}
  .main .sub{margin:5px 0 16px;font-size:13px;font-weight:500;color:var(--sub);}
  
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;}
  .grid > div{min-width:0;}
  .grid span{display:block;font-size:11px;font-weight:600;color:var(--sub);letter-spacing:.04em;margin-bottom:3px;}
  .grid b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em;}
  
  .warn{
    margin:16px 0 0; padding:12px; border-radius:10px;
    background:var(--warn-bg); color:var(--warn-text);
    font-size:13px; font-weight:500; line-height:1.5;
  }

  .opt{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--sub);line-height:1.5;}
  .opt b{color:var(--text);font-weight:600;}

  .alt{padding:15px 18px;}
  .alt + .alt{border-top:1px solid var(--line);}
  .alt h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;}
  .alt p{margin:4px 0 0;font-size:13px;color:var(--sub);font-weight:500;}
  .alt .kv{margin-top:8px;display:flex;gap:16px;flex-wrap:wrap;font-size:13px;font-variant-numeric:tabular-nums;}
  .alt .kv span{color:var(--sub);}
  .alt .kv b{font-weight:600;}

  .empty{padding:26px 18px;text-align:center;}
  .empty h3{margin:0 0 6px;font-size:17px;font-weight:600;}
  .empty p{margin:0;font-size:13px;color:var(--sub);line-height:1.6;}

  .tip{margin-top:16px;padding:0 4px;font-size:12px;color:var(--sub);line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">

  <header class="hd">
    <h1>粉体设备预选型</h1>
    <p>输入物料自动识别物性 · 精准匹配产能</p>
  </header>

  <!-- 物料基础信息 -->
  <section class="card">
    <div class="row">
      <label class="lbl">物料名称 <em>输入名称自动匹配</em></label>
      <input id="mat" type="text" list="matList" placeholder="如 石英、甘草、碳酸钙" autocomplete="off" spellcheck="false">
      <datalist id="matList">
        <!-- 动态生成 -->
      </datalist>
    </div>
    <div class="row">
      <label class="lbl">物料类别</label>
      <select id="cat">
        <option value="">请选择</option>
        <option value="mineral">非金属矿</option>
        <option value="hard">硬质矿物 / 高硅</option>
        <option value="battery">电池材料</option>
        <option value="pharma">医药 / 原料药</option>
        <option value="food">食品 / 保健品</option>
        <option value="chem">化工 / 颜料</option>
        <option value="herb">中药 / 植物纤维</option>
        <option value="metal">金属粉末</option>
        <option value="waste">固废 / 粉煤灰</option>
        <option value="other">其他</option>
      </select>
    </div>
    <div class="row">
      <label class="lbl">目标产能（kg/h） <em>精准匹配单机</em></label>
      <input id="cap" type="text" inputmode="decimal" placeholder="如 25, 1000" autocomplete="off">
    </div>
  </section>

  <!-- 粒度要求 -->
  <section class="card">
    <div class="row">
      <label class="lbl">目标粒度（µm） <em>支持范围：如 10-20</em></label>
      <input id="size" type="text" inputmode="text" placeholder="如 10-20，或 74" autocomplete="off">
    </div>
    <div class="seg" id="seg">
      <button data-v="D50" class="on">D50</button>
      <button data-v="D90">D90</button>
      <button data-v="D97">D97</button>
      <button data-v="D99">D99</button>
      <button data-v="D100">D100</button>
    </div>
  </section>

  <!-- 工艺及物料特性 -->
  <section class="card">
    <div class="row">
      <label class="lbl">物料特性与工艺要求（自动填充，可手动修改）</label>
    </div>
    <div class="chips" id="chips">
      <button class="chip" data-k="hard">莫氏硬度 &gt; 5</button>
      <button class="chip" data-k="quartz">含石英 / 磨蚀性极高</button>
      <button class="chip" data-k="wet">含水率 &gt; 5%</button>
      <button class="chip" data-k="fib">纤维状 / 高韧性</button>
      <button class="chip" data-k="sticky">粘性强 / 易糊壁</button>
      <button class="chip" data-k="static">易起静电</button>
      <button class="chip" data-k="flow">流动性差 / 易团聚</button>
      <button class="chip" data-k="heat">热敏 / 低熔点</button>
      <button class="chip" data-k="oxidation">易氧化</button>
      <button class="chip" data-k="volatile">易挥发</button>
      <button class="chip" data-k="pure">要求无金属污染</button>
      <button class="chip" data-k="gmp">医药 / 食品 GMP</button>
    </div>
  </section>

  <button class="go" id="go">开始评估</button>

  <div id="out"></div>

  <p class="tip">系统采用严格的“产能优先 + 互斥防呆”算法，杜绝“大马拉小车”。结果仅供评估，实际报价以工程师选型为准。</p>

</div>

<script>

  "糖": { cat: "food", attrs: ["gmp", "sticky", "heat"] },
  "盐": { cat: "food", attrs: ["gmp", "wet"] },
  "奶粉": { cat: "food", attrs: ["gmp", "sticky"] },
  "大豆": { cat: "food", attrs: ["fib"] },
  
  "氧化铝": { cat: "hard", attrs: ["hard", "pure"] },
  "碳化硅": { cat: "hard", attrs: ["hard", "pure", "quartz"] },
  "氧化锆": { cat: "hard", attrs: ["hard", "pure"] },
  
  "PVC": { cat: "chem", attrs: ["heat", "static"] },
  "PE": { cat: "chem", attrs: ["heat", "fib"] },
  "颜料": { cat: "chem", attrs: ["pure"] },

  "铁粉": { cat: "metal", attrs: ["oxidation", "pure"] },
  "钴粉": { cat: "metal", attrs: ["oxidation", "pure"] }
};

/* ============ 设备库 ============ */
const DB = [
  {
    id:'MQW', name:'MQW 流化床式气流磨', sub:'卧式分级轮 · 干法超细',
    cat:'气流磨', d97:[3,45], good:['heat','pure','ex','gmp','oxidation','volatile'], bad:['fib','sticky','quartz','hard','wet','flow'],
    models:[['MQW03',0.3,1],['MQW06',10,30],['MQW10',20,300],['MQW20',40,600],['MQW30',100,900],['MQW40',200,1200],['MQW60',500,2000],['MQW80',800,3000],['MQW100',1000,4000],['MQW120',1500,6000],['MQW160',2000,8000],['MQW240',4000,12000]],
    opt:['氮气循环保护','陶瓷内衬','CIP / SIP','防静电设计']
  },
  {
    id:'MQL', name:'MQL 流化床式气流磨', sub:'立式单转子 · 大产能',
    cat:'气流磨', d97:[6,150], good:['heat','pure','ex','gmp','oxidation','volatile'], bad:['fib','sticky','quartz','hard','wet','flow'],
    models:[['MQL03',10,40],['MQL06',10,60],['MQL10',20,300],['MQL20',40,600],['MQL30',100,900],['MQL40',200,1200],['MQL50',500,2000],['MQL80',800,3000],['MQL100',1000,4000],['MQL120',1500,6000],['MQL160',2000,8000],['MQL240',4000,12000]],
    opt:['氮气循环保护','陶瓷内衬','称重喂料','防静电设计']
  },
  {
    id:'CSMV', name:'CSM-V 空气分级磨', sub:'立式分级轮 · 通用型机械磨',
    cat:'机械磨', d97:[5,115], good:['soft','flow'], bad:['pure','fib','hard','quartz','sticky','oxidation'],
    models:[['CSM280-V',60,150],['CSM350-V',120,280],['CSM410-V',180,380],['CSM510-V',260,520],['CSM710-V',400,760],['CSM760-V',450,850],['CSM900-V',700,1300],['CSM1000-V',850,1500],['CSM1100-V',1100,2000],['CSM1250-V',1500,2600],['CSM1500-V',2000,3400],['CSM2000-V',3000,5200]],
    opt:['陶瓷内衬','低温 / 惰性气体循环','防爆设计']
  },
  {
    id:'CSMVD', name:'CSM-VD 空气分级磨', sub:'双轴合一 · 医药食品级',
    cat:'机械磨', d97:[5,115], good:['gmp','pure','soft'], bad:['fib','hard','quartz','sticky'],
    models:[['CSM280-VD',30,80],['CSM350-VD',55,140],['CSM450-VD',90,220],['CSM510-VD',130,320],['CSM710-VD',220,560],['CSM900-VD',400,1000],['CSM1100-VD',650,1600]],
    opt:['CIP / SIP','陶瓷内衬','GMP 验证文件']
  },
  {
    id:'CUM', name:'CUM 系列机械粉碎机', sub:'锤式/针盘 · 韧性物料优选',
    cat:'机械磨', d97:[25,600], good:['fib','sticky','soft'], bad:['hard','pure','quartz','static'],
    models:[['CUM160',30,80],['CUM260',90,240],['CUM360',180,480],['CUM500',350,950],['CUM630',600,1600],['CUM800',950,2600],['CUM1000',1500,4000]],
    opt:['陶瓷内衬','防爆设计','加热/冷却风']
  },
  {

    cat:'机械磨', d97:[6,380], good:['fib','hard','soft','sticky'], bad:['pure','static'],
    models:[['MZ100',100,200],['MZ300',200,300],['MZ500',300,600],['MZ600',400,800],['MZ800',500,1000],['MZ1000',800,1500],['MZ1200',1000,1800],['MZ2000',2000,3000]],
    opt:['陶瓷磨介','低温 / 水冷夹套','GMP 结构']
  },
  {
    id:'BALL', name:'球磨分级生产线', sub:'大规模 · 低能耗 · 闭路循环',
    cat:'球磨', d97:[3,45], good:['hard','wet','quartz','waste','sticky'], bad:['heat','gmp'],
    models:[
      { name:'IBM1570 + FL360', cap:[500, 2000], desc:'小产能标准线' },
      { name:'IBM1830 + FL360', cap:[1000, 3000], desc:'1吨级主力线' },
      { name:'IBM2200 + FL450', cap:[2500, 5000], desc:'3吨级标准线' },
      { name:'IBM2400 + FL600', cap:[4000, 8000], desc:'5吨级主力线' },
      { name:'IBM2600 + FL630', cap:[6000, 12000], desc:'8吨级标准线' },
      { name:'IBM2800 + FL800', cap:[8000, 16000], desc:'10吨级大线' },
      { name:'IBM3000 + FL1000', cap:[12000, 25000], desc:'20吨级大线' }
    ],
    opt:['高铬耐磨衬板/钢球','陶瓷衬板','除铁器','自动包装']
  }
];

/* ============ 动态生成物料联想列表 ============ */
const matListEl = document.getElementById('matList');
Object.keys(MATERIAL_DB).forEach(k => {
  const opt = document.createElement('option');
  opt.value = k;
  matListEl.appendChild(opt);
});

/* ============ 交互 ============ */
const $ = id => document.getElementById(id);
const matEl  = $('mat'),  catEl  = $('cat'),  capEl = $('cap');
const sizeEl = $('size'), segEl  = $('seg'),  chipsEl = $('chips');
const outEl  = $('out');

let basis = 'D50'; 

segEl.addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b) return;
  [...segEl.children].forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  basis = b.dataset.v;
});

chipsEl.addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if(!b) return;
  b.classList.toggle('on');
});

// 物料名称输入联动
matEl.addEventListener('input', () => {
  const val = matEl.value.trim();
  const info = MATERIAL_DB[val];
  if (info) {
    catEl.value = info.cat;
    [...chipsEl.children].forEach(b => {
      b.classList.toggle('on', info.attrs.includes(b.dataset.k));
    });
  }
});

/* ============ 计算逻辑 ============ */
// 解析粒度范围，提取最严苛的上限
function parseSizeRange(str) {
  if (!str) return 0;
  // 匹配数字，支持 10-20, 10~20, 10
  const nums = str.match(/\d+(\.\d+)?/g);
  if (!nums) return 0;
  if (nums.length >= 2) return parseFloat(nums[1]); // 取上限
  return parseFloat(nums[0]);
}

function normD97(size, basis){
  if (basis === 'D50') return size * 2.5;
  if (basis === 'D90') return size * 1.4;
  if (basis === 'D99') return size * 1.1;
  if (basis === 'D100') return size * 0.6;
  return size;
}

function scoreSeries(s, d97, cap, attrs){
  // ----- 绝对互斥逻辑 (防呆) -----
  const isHighHard = attrs.includes('hard') || attrs.includes('quartz');
  
  if (s.cat === '机械磨' && isHighHard) return -1; 
  if (s.cat === '气流磨' && attrs.includes('sticky')) return -1;
  if (s.cat === '气流磨' && attrs.includes('fib')) return -1;
  if (s.cat === '气流磨' && attrs.includes('wet')) return -1;
  if (s.id === 'BALL' && cap < 500) return -1; // 球磨机不适合极小产能

  // ----- 粒度可达性 -----
  if (d97 < s.d97[0] * 0.65) return -1;
  if (d97 > s.d97[1] * 2.2) return -1;

  let sc = 0;
  
  // 1. 产能匹配 (优先级最高，权重极大)
  let bestModelIdx = -1;
  let minDiff = Infinity;
  let maxCap = 0;
  
  if (s.id === 'BALL') {
    maxCap = s.models[s.models.length - 1].cap[1];
    for (let i = 0; i < s.models.length; i++) {
      const m = s.models[i];
      if (cap >= m.cap[0] && cap <= m.cap[1]) {
        sc += 100; // 完美落在单机区间
        minDiff = 0;
        break;
      }
      // 找最接近的
      const diff = cap < m.cap[0] ? (m.cap[0] - cap) / cap : (cap - m.cap[1]) / cap;
      if (diff < minDiff) { minDiff = diff; bestModelIdx = i; }
    }
  } else {
    maxCap = s.models[s.models.length - 1][2];
    for (let i = 0; i < s.models.length; i++) {
      const m = s.models[i];
      if (cap >= m[1] && cap <= m[2]) {
        sc += 100; // 完美落在单机区间
        minDiff = 0;
        break;
      }
      const diff = cap < m[1] ? (m[1] - cap) / cap : (cap - m[2]) / cap;
      if (diff < minDiff) { minDiff = diff; bestModelIdx = i; }
    }
  }

  // 如果客户需求严重低于设备最小产能 (大马拉小车)，直接重罚
  if (minDiff > 0.5) {
    sc -= 150; 
  } else if (minDiff > 0.1) {
    sc -= 30;
  }

  // 粒度分
  if (d97 >= s.d97[0] && d97 <= s.d97[1]) sc += 60;
  else if (d97 < s.d97[0]) sc += 15;
  else sc += 20;

  // 属性分加减
  for (const a of attrs){
    if (s.good.includes(a)) sc += 20; 
    if (s.bad.includes(a))  sc -= 35;
    if ((a === 'oxidation' || a === 'volatile') && s.cat === '机械磨') sc -= 40;
  }

  if (isHighHard && s.id === 'BALL') sc += 80;

  return sc;
}

function pickModel(s, cap){
  if (s.id === 'BALL') {
    for (const m of s.models){
      if (cap >= m.cap[0] && cap <= m.cap[1]) {
        return { name: m.name, range: `${m.cap[0]}–${m.cap[1]} kg/h`, desc: m.desc };
      }
    }
    // 找最接近的兜底
    let best = s.models[0], minD = Infinity;
    for (const m of s.models) {
       let d = cap < m.cap[0] ? m.cap[0] - cap : cap - m.cap[1];
       if (d < minD) { minD = d; best = m; }
    }
    return { name: best.name + ' (需定制)', range: `${best.cap[0]}–${best.cap[1]} kg/h`, desc: best.desc };
  } else {
    for (const m of s.models){
      if (cap >= m[1] && cap <= m[2]) return { name: m[0], range: `${m[1]}–${m[2]} kg/h`, desc:'' };
    }
    let best = s.models[0], minD = Infinity;
    for (const m of s.models) {
       let d = cap < m[1] ? m[1] - cap : cap - m[2];
       if (d < minD) { minD = d; best = m; }
    }
    return { name: best[0] + ' (需定制)', range: `${best[1]}–${best[2]} kg/h`, desc:'' };
  }
}

function render(list, ctx){
  if (!list.length){
    outEl.innerHTML = `
      <div class="card">
        <div class="empty">
          <h3>参数存在互斥，无匹配机型</h3>
          <p>当前工艺组合超出常规物理界限。<br>建议联系埃尔派工程师安排物料小试后定制专机。</p>
        </div>
      </div>`;
    return;
  }

  const main = list[0];
  const mm = pickModel(main.s, ctx.cap);
  const matName = matEl.value.trim();
  
  let warningHtml = '';
  if (ctx.attrs.includes('quartz') || ctx.attrs.includes('hard')) {
    warningHtml += `
      <div class="warn">
        <b>⚠️ 工程师选型警告：</b><br>
        物料磨蚀性极强，严禁使用普通钢衬板。<br>
        推荐配置：<b>高铬合金耐磨衬板 + 高铬钢球 + 管道除铁器</b>。
      </div>
    `;
  }
  if (ctx.attrs.includes('oxidation') || ctx.attrs.includes('volatile')) {
    warningHtml += `
      <div class="warn" style="background:rgba(255,59,48,.15);color:var(--danger);">
        <b>⛔ 严控环境：</b><br>
        系统必须配备<b>全密闭惰性气体循环（氮气保护）</b>及含氧量在线监测，以防燃爆。
      </div>
    `;
  }

  let html = `
    <div class="res-head">评估结果 · ${ctx.sizeText} · ${ctx.cap} kg/h</div>
    <div class="card">
      <div class="main">
        <div class="badge">主推方案</div>
        <h2>${main.s.name}</h2>
        <p class="sub">${main.s.sub}${matName ? ' · ' + matName : ''}</p>
        <div class="grid">
          <div><span>推荐配置</span><b>${mm.name}</b></div>
          <div><span>产能范围</span><b>${mm.range}</b></div>
          <div><span>可达粒度</span><b>D97 ${main.s.d97[0]}–${main.s.d97[1]} µm</b></div>
          <div><span>工艺类型</span><b>${main.s.cat}</b></div>
        </div>
        ${warningHtml}
        ${main.s.opt ? `<div class="opt"><b>推荐选配项</b><br>${main.s.opt.join(' · ')}</div>` : ''}
      </div>
    </div>`;

  const alts = list.slice(1);
  if (alts.length){
    html += `<div class="res-head">备选方案</div><div class="card">`;
    for (const a of alts){
      const am = pickModel(a.s, ctx.cap);
      html += `
        <div class="alt">
          <h3>${a.s.name}</h3>
          <p>${a.s.sub}</p>
          <div class="kv">
            <div><span>型号 </span><b>${am.name}</b></div>
            <div><span>产能 </span><b>${am.range}</b></div>
            <div><span>粒度 </span><b>D97 ${a.s.d97[0]}–${a.s.d97[1]} µm</b></div>
          </div>
        </div>`;
    }
    html += `</div>`;
  }

  outEl.innerHTML = html;
}

function evaluate(){
  const sizeRaw = parseSizeRange(sizeEl.value);
  if (!(sizeRaw > 0)){
    outEl.innerHTML = `<div class="card"><div class="empty"><h3>请填写目标粒度</h3><p>粒度是选型的核心参数。</p></div></div>`;
    return;
  }

  const capRaw = parseFloat(capEl.value);
  const cap = capRaw > 0 ? capRaw : 1000; 
  const d97 = normD97(sizeRaw, basis);
  const attrs = [...chipsEl.querySelectorAll('.chip.on')].map(b => b.dataset.k);

  const scored = [];
  for (const s of DB){
    const sc = scoreSeries(s, d97, cap, attrs);
    if (sc > 0) scored.push({ s, sc });
  }
  scored.sort((a, b) => b.sc - a.sc);

  render(scored.slice(0, 3), {
    cap, d97, attrs,
    sizeText: `${basis} ${sizeEl.value} µm`
  });
}

$('go').addEventListener('click', evaluate);

[sizeEl, capEl].forEach(el => {
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ el.blur(); evaluate(); }
  });
});
</script>
</body>
</html>
